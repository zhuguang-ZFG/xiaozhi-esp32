name: Build Boards

on:
  push:
    branches:
      - main
      - ci/* # for ci test
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  prepare:
    name: Determine variants to build
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.1
    env:
      CXX: /usr/bin/g++
    outputs:
      variants: ${{ steps.select.outputs.variants }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: DaveGamble/cJSON
          ref: v1.7.19
          path: managed_components/espressif__cjson/cJSON
      - uses: actions/checkout@v4
        with:
          repository: 78/esp-ml307
          ref: 9f2a278ac6bf4ca3d6bc5057e8fcf10097cc583f
          path: managed_components/78__esp-ml307
      - name: Prepare generated test sources
        shell: bash
        run: |
          set -euo pipefail
          for patch in patches/esp-ml307-*.patch; do
            git apply --recount -p1 "$patch"
          done
          printf '%s\n' 5443836acc5bb9478d9d93c8178cd52a0a53be13470e006656d751e96cf33f9c > managed_components/78__esp-ml307/.component_hash
          python scripts/gen_lang.py --language zh-CN --output main/assets/lang_config.h

      - name: Test release tooling
        run: python -m unittest discover -s scripts/tests -v

      - id: list
        name: Get all variant list
        run: |
          echo "all_variants=$(python scripts/release.py --list-boards --json)" >> $GITHUB_OUTPUT

      - id: select
        name: Select variants based on changes
        shell: bash
        env:
          ALL_VARIANTS: ${{ steps.list.outputs.all_variants }}
        run: |
          EVENT_NAME="${{ github.event_name }}"

          # push 到 main 分支，编译全部变体
          if [[ "$EVENT_NAME" == "push" ]]; then
            echo "variants=$ALL_VARIANTS" >> $GITHUB_OUTPUT
            exit 0
          fi

          # pull_request 场景
          # actions/checkout checks out GitHub's synthetic PR merge commit. Its
          # first and second parents are the exact base and head commits used
          # for this run, even when the event SHAs are not exposed as refs in
          # the job container.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASE_SHA="HEAD^1"
          HEAD_SHA="HEAD^2"
          echo "Base: $(git rev-parse "$BASE_SHA"), Head: $(git rev-parse "$HEAD_SHA")"

          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo -e "Changed files:\n$CHANGED"

          SELECTED=$(printf '%s\n' "$CHANGED" | python scripts/release.py --select-changed)
          echo "variants=$SELECTED" >> $GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.full_name }}
    needs: prepare
    if: ${{ needs.prepare.outputs.variants != '[]' }}
    strategy:
      fail-fast: false  # 单个变体失败不影响其它变体
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.variants) }}
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 固件依赖由 IDF 下载完整组件与校验元数据；裸 cJSON 检出仅供宿主测试。
      - uses: actions/checkout@v4
        with:
          repository: 78/esp-ml307
          ref: 9f2a278ac6bf4ca3d6bc5057e8fcf10097cc583f
          path: managed_components/78__esp-ml307
      - name: Prepare generated firmware sources
        shell: bash
        run: |
          set -euo pipefail
          for patch in patches/esp-ml307-*.patch; do
            git apply --recount -p1 "$patch"
          done
          printf '%s\n' 5443836acc5bb9478d9d93c8178cd52a0a53be13470e006656d751e96cf33f9c > managed_components/78__esp-ml307/.component_hash
          python scripts/gen_lang.py --language zh-CN --output main/assets/lang_config.h

      - name: Build current variant
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          # 所有 ESP32-P4 变体都会启用 BSP 5.2.3，而该 BSP 约束 esp_video ~2.0；
          # 只在 CI 工作副本按 target 临时降版，S3/C3 产品板继续使用仓内 2.3.*。
          if [[ "${{ matrix.target }}" == "esp32p4" ]]; then
            sed -i 's/version: 2\.3\.\*/version: 2.0.*/' main/idf_component.yml
            grep -F 'version: 2.0.*' main/idf_component.yml
          fi
          python scripts/release.py ${{ matrix.board }} --name ${{ matrix.name }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi_${{ matrix.full_name }}_${{ github.sha }}
          path: build/merged-binary.bin
          if-no-files-found: error

  compatibility-idf5:
    name: IDF 5.5 compatibility - ${{ matrix.name }}
    if: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: xmini-c3
            name: xmini-c3
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 固件依赖由 IDF 下载完整组件与校验元数据；裸 cJSON 检出仅供宿主测试。
      - uses: actions/checkout@v4
        with:
          repository: 78/esp-ml307
          ref: 9f2a278ac6bf4ca3d6bc5057e8fcf10097cc583f
          path: managed_components/78__esp-ml307
      - name: Prepare compatibility sources
        shell: bash
        run: |
          set -euo pipefail
          for patch in patches/esp-ml307-*.patch; do
            git apply --recount -p1 "$patch"
          done
          printf '%s\n' 5443836acc5bb9478d9d93c8178cd52a0a53be13470e006656d751e96cf33f9c > managed_components/78__esp-ml307/.component_hash
          python scripts/gen_lang.py --language zh-CN --output main/assets/lang_config.h

      - name: Build compatibility variant
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/release.py ${{ matrix.board }} --name ${{ matrix.name }}

  blufi-idf6:
    name: IDF 6 BluFi option
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build BluFi-enabled firmware
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          idf.py -B build-blufi \
            -DSDKCONFIG=build-blufi/sdkconfig \
            -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.esp32s3;scripts/ci/blufi.sdkconfig.defaults" \
            -DIDF_TARGET=esp32s3 \
            -DBOARD_NAME=bread-compact-wifi \
            -DBOARD_TYPE=bread-compact-wifi \
            build
