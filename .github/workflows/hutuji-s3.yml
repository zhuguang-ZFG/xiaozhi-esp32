name: Hutuji S3
on:
  push:
    branches: [feat/hutuji-usb-pipe]
  pull_request:
    branches: [feat/hutuji-usb-pipe]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    env:
      CXX: /usr/bin/g++
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: DaveGamble/cJSON
          ref: v1.7.19
          path: managed_components/espressif__cjson/cJSON
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest
      - run: python -m pytest -q scripts/tests
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        board: [freenove-esp32s3-display-2.8-lcd, lichuang-dev]
    container:
      image: espressif/idf:v6.0.1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: 构建交付板型
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          python scripts/release.py "${{ matrix.board }}" --name "${{ matrix.board }}"
          test -s build/xiaozhi.bin
      - uses: actions/upload-artifact@v4
        with:
          name: s3-${{ matrix.board }}-${{ github.sha }}
          path: |
            build/xiaozhi.bin
            build/merged-binary.bin
          if-no-files-found: error
