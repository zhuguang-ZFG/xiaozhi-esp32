name: Hutuji S3
on:
  push:
    branches: [feat/hutuji-usb-pipe]
  pull_request:
    branches: [feat/hutuji-usb-pipe]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    env:
      CXX: /usr/bin/g++
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: DaveGamble/cJSON
          ref: v1.7.19
          path: managed_components/espressif__cjson/cJSON
      - uses: actions/checkout@v4
        with:
          repository: 78/esp-ml307
          ref: 9f2a278ac6bf4ca3d6bc5057e8fcf10097cc583f
          path: managed_components/78__esp-ml307
      - name: Prepare generated test sources
        shell: bash
        run: |
          set -euo pipefail
          for patch in patches/esp-ml307-*.patch; do
            git apply --recount -p1 "$patch"
          done
          printf '%s\n' 5443836acc5bb9478d9d93c8178cd52a0a53be13470e006656d751e96cf33f9c > managed_components/78__esp-ml307/.component_hash
          python scripts/gen_lang.py --language zh-CN --output main/assets/lang_config.h
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest
      - run: python -m pytest -q scripts/tests
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        board: [freenove-esp32s3-display-2.8-lcd, lichuang-dev]
    container:
      image: espressif/idf:v6.0.1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: 78/esp-ml307
          ref: 9f2a278ac6bf4ca3d6bc5057e8fcf10097cc583f
          path: managed_components/78__esp-ml307
      - name: Apply vendor patches and generate language header
        shell: bash
        run: |
          set -euo pipefail
          for patch in patches/esp-ml307-*.patch; do
            git apply --recount -p1 "$patch"
          done
          printf '%s\n' 5443836acc5bb9478d9d93c8178cd52a0a53be13470e006656d751e96cf33f9c > managed_components/78__esp-ml307/.component_hash
          python scripts/gen_lang.py --language zh-CN --output main/assets/lang_config.h
      - name: 构建交付板型
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          python scripts/release.py "${{ matrix.board }}" --name "${{ matrix.board }}"
          test -s build/xiaozhi.bin
      - uses: actions/upload-artifact@v4
        with:
          name: s3-${{ matrix.board }}-${{ github.sha }}
          path: |
            build/xiaozhi.bin
            build/merged-binary.bin
          if-no-files-found: error
